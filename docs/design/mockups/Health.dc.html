<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reveille — Reliability</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFB547}a:hover{color:#FFD08A}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0D11; color: #F3F4F6; font-family: 'Geist', system-ui, sans-serif; font-variant-numeric: tabular-nums; box-sizing: border-box">

  <header style="padding: 52px 20px 14px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">Health</h1>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <span style="font-size: 17px; font-weight: 500">7 of 8 checks pass</span>
        <span style="font-size: 13px; color: #FF8A75">Alarms may not ring</span>
      </div>
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{bar}}" as="b" hint-placeholder-count="8">
          <span style="height: 6px; border-radius: 3px; background: {{b.c}}"></span>
        </sc-for>
      </div>
    </div>
  </header>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 16px">

    <section aria-label="Needs attention" style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 20px; background: #1E1513; border: 1px solid #3A2A25">
      <div style="display: flex; gap: 12px; align-items: flex-start">
        <span style="width: 32px; height: 32px; border-radius: 10px; background: #3A221D; color: #FF8A75; display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 16H3z"></path><path d="M12 10v4"></path><path d="M12 17.5v.01"></path></svg></span>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 16px; font-weight: 600">Battery optimization off</span>
          <span style="font-size: 13px; color: #D8C2BC; line-height: 1.45">Battery-optimized apps can be delayed or stopped in the background.</span>
        </div>
      </div>
      <button style="align-self: flex-start; margin-left: 44px; height: 40px; padding: 0 16px; border-radius: 20px; border: none; background: #FF8A75; color: #1E0D09; font-size: 14px; font-weight: 600">Open settings</button>
    </section>

    <section aria-label="Passing checks" style="border-radius: 20px; background: #15181E; border: 1px solid #22262E; padding: 4px 0">
      <sc-for list="{{ok}}" as="c" hint-placeholder-count="7">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 16px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7EE0C3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          <span style="flex: 1; font-size: 14px">{{c.t}}</span>
          <span style="font-size: 12px; color: #A1A9B5">{{c.n}}</span>
        </div>
      </sc-for>
    </section>

    <section aria-label="Test alarm" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px; background: #15181E; border: 1px solid #22262E">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 600">Ring a test alarm</span>
        <span style="font-size: 13px; color: #A1A9B5">In 2 minutes. Lock the phone and wait.</span>
      </div>
      <button style="height: 44px; padding: 0 18px; border-radius: 22px; border: none; background: {{accent}}; color: #1A1205; font-size: 14px; font-weight: 600">Start</button>
    </section>

    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 8px 4px 0">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #A1A9B5">Recent alarms</h2>
    </div>
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{log}}" as="l" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 4px; font-size: 13px">
          <span style="font-family: 'Geist Mono', monospace; color: #A1A9B5; width: 92px">{{l.when}}</span>
          <span style="flex: 1">{{l.label}}</span>
          <span style="color: {{l.c}}">{{l.out}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding: 8px 12px 20px; box-sizing: border-box; background: #101318; border-top: 1px solid #1D2129; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #A1A9B5; font-size: 12px; font-weight: 500">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2"></path><path d="M5 3L2 6M19 3l3 3"></path></svg></span>Today
    </a>
    <a href="Policies.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #A1A9B5; font-size: 12px; font-weight: 500">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>Policies
    </a>
    <a href="Health.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #F3F4F6; font-size: 12px; font-weight: 500">
      <span style="width: 56px; height: 30px; border-radius: 15px; background: #2A2418; color: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"></path></svg></span>Health
    </a>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #A1A9B5; font-size: 12px; font-weight: 500">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></span>Settings
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#8AB4FF","#7EE0C3","#F2A0C8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#FFB547',
      bar: [0, 1, 2, 3, 4, 5, 6, 7].map((i) => ({ c: i === 7 ? '#FF7A66' : '#7EE0C3' })),
      ok: [
        { t: 'Exact alarms allowed', n: '' },
        { t: 'Notifications allowed', n: '' },
        { t: 'Full-screen alarms allowed', n: '' },
        { t: 'Alarm notifications at high importance', n: '' },
        { t: 'Alarm volume not muted', n: '' },
        { t: 'Autostart on', n: 'HyperOS' },
        { t: 'Locked in Recents', n: 'Confirmed' }
      ],
      log: [
        { when: 'Today 07:55', label: 'Work', out: 'dismissed', c: '#A1A9B5' },
        { when: 'Fri 08:55', label: 'Work', out: 'snoozed, dismissed', c: '#A1A9B5' },
        { when: 'Thu 06:30', label: 'Gym', out: 'missed', c: '#FF8A75' }
      ]
    };
  }
}
</script>
</body>
</html>
