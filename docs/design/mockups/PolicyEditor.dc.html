<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reveille — Edit policy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFB547}a:hover{color:#FFD08A}
button,input{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0D11; color: #F3F4F6; font-family: 'Geist', system-ui, sans-serif; font-variant-numeric: tabular-nums; box-sizing: border-box">

  <header style="display: flex; align-items: center; gap: 4px; padding: 44px 8px 4px">
    <a href="Policies.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #F3F4F6"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="flex: 1; margin: 0; font-size: 18px; font-weight: 600">Edit policy</h1>
    <button aria-label="Delete policy" style="width: 48px; height: 48px; border: none; background: transparent; color: #A1A9B5; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
  </header>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 4px 16px 0">

    <div style="display: flex; gap: 10px">
      <label style="flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 10px 16px; border-radius: 16px; background: #15181E; border: 1px solid #22262E">
        <span style="font-size: 12px; color: #A1A9B5">Name</span>
        <input value="Work" style="border: none; outline: none; background: transparent; color: #F3F4F6; font-size: 18px; font-weight: 600; padding: 0">
      </label>
      <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; width: 84px; border-radius: 16px; background: #15181E; border: 1px solid #22262E">
        <span style="font-size: 12px; color: #A1A9B5">Enabled</span>
        <span role="img" aria-label="On" style="width: 44px; height: 26px; border-radius: 13px; background: {{accent}}; position: relative"><span style="position: absolute; top: 3px; left: 21px; width: 20px; height: 20px; border-radius: 10px; background: #1A1205"></span></span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 16px; border-radius: 16px; background: #15181E; border: 1px solid #22262E; color: #F3F4F6; text-align: left">
        <span style="font-size: 12px; color: #A1A9B5">Active from</span>
        <span style="font-size: 15px; font-weight: 500">Always</span>
      </button>
      <button style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 16px; border-radius: 16px; background: #15181E; border: 1px solid #22262E; color: #F3F4F6; text-align: left">
        <span style="font-size: 12px; color: #A1A9B5">Active until</span>
        <span style="font-size: 15px; font-weight: 500">30 Jun 2027</span>
      </button>
    </div>

    <h2 style="margin: 10px 4px 0; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #A1A9B5">Alarm times</h2>

    <section aria-label="Alarm time 07:55" style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 20px; background: #15181E; border: 1px solid {{accentLine}}">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <button style="border: none; background: transparent; color: #F3F4F6; padding: 0; font-size: 48px; font-weight: 300; letter-spacing: -0.03em; line-height: 1">07:55</button>
        <button aria-label="Remove alarm time" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: #1D2129; color: #A1A9B5; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <div role="group" aria-label="Days" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <button aria-pressed="{{d.on}}" style="height: 40px; border-radius: 12px; border: none; background: {{d.bg}}; color: {{d.fg}}; font-size: 13px; font-weight: 600">{{d.l}}</button>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="font-size: 14px; color: #A1A9B5; flex: 1">Repeat every</span>
        <div style="display: flex; align-items: center; height: 40px; border-radius: 20px; background: #1D2129">
          <button aria-label="Fewer weeks" style="width: 40px; height: 40px; border: none; background: transparent; color: #F3F4F6; font-size: 18px">−</button>
          <span style="min-width: 64px; text-align: center; font-size: 14px; font-weight: 500">1 week</span>
          <button aria-label="More weeks" style="width: 40px; height: 40px; border: none; background: transparent; color: #F3F4F6; font-size: 18px">+</button>
        </div>
      </div>
      <label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 12px; background: #1D2129">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A9B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.5" cy="8.5" r="1"></circle></svg>
        <input placeholder="Label (optional)" style="flex: 1; border: none; outline: none; background: transparent; color: #F3F4F6; font-size: 14px; padding: 0">
      </label>
    </section>

    <button style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px; background: #15181E; border: 1px solid #22262E; color: #F3F4F6; text-align: left">
      <span style="font-size: 28px; font-weight: 300; letter-spacing: -0.02em">08:55</span>
      <span style="flex: 1; font-size: 14px; color: #A1A9B5">Thu, Fri</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A9B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>

    <div style="display: flex; gap: 10px">
      <button style="flex: 1; height: 44px; border-radius: 22px; border: 1px dashed #3A404A; background: transparent; color: #F3F4F6; font-size: 14px; font-weight: 500">+ Alarm time</button>
      <button style="flex: 1; height: 44px; border-radius: 22px; border: 1px dashed #3A404A; background: transparent; color: #F3F4F6; font-size: 14px; font-weight: 500">+ Pause</button>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: #15181E">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A9B5" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 4v4M17 4v4M4 10h16"></path><rect x="4" y="6" width="16" height="14" rx="2"></rect></svg>
      <span style="flex: 1; font-size: 14px">Paused 23 Dec → 6 Jan</span>
      <button style="height: 32px; padding: 0 10px; border: none; background: transparent; color: #A1A9B5; font-size: 13px">Remove</button>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 28px; background: #0B0D11; border-top: 1px solid #1D2129; display: flex; align-items: center; gap: 14px">
    <span style="flex: 1; font-size: 13px; color: #A1A9B5; line-height: 1.4">Next: <span style="color: #F3F4F6">Tue 3 Nov, 07:55</span></span>
    <button style="height: 52px; padding: 0 32px; border-radius: 26px; border: none; background: {{accent}}; color: #1A1205; font-size: 16px; font-weight: 600">Save</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#8AB4FF","#7EE0C3","#F2A0C8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FFB547';
    const on = [0, 1, 2];
    return {
      accent,
      accentLine: '#3A3020',
      days: ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((l, i) => ({
        l, on: on.includes(i) ? 'true' : 'false',
        bg: on.includes(i) ? accent : '#1D2129',
        fg: on.includes(i) ? '#1A1205' : '#A1A9B5'
      }))
    };
  }
}
</script>
</body>
</html>
