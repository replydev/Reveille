<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reveille — Policies</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFB547}a:hover{color:#FFD08A}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0D11; color: #F3F4F6; font-family: 'Geist', system-ui, sans-serif; font-variant-numeric: tabular-nums; box-sizing: border-box">

  <header style="padding: 52px 20px 16px; display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">Policies</h1>
    <p style="margin: 0; font-size: 14px; color: #A1A9B5; line-height: 1.45">Named groups of recurring alarms. Turn a whole routine on or off in one tap.</p>
  </header>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 16px">
    <sc-for list="{{policies}}" as="p" hint-placeholder-count="3">
      <a href="PolicyEditor.dc.html" style="display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 24px; background: #15181E; border: 1px solid #22262E; text-decoration: none; color: inherit; opacity: {{p.opacity}}">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 36px; height: 36px; border-radius: 12px; background: {{p.tint}}; display: flex; align-items: center; justify-content: center; flex: none">
            <span style="width: 12px; height: 12px; border-radius: 3px; background: {{p.color}}"></span>
          </span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-size: 17px; font-weight: 600">{{p.name}}</span>
            <span style="font-size: 13px; color: {{p.statusColor}}">{{p.status}}</span>
          </span>
          <span role="img" aria-label="{{p.switchLabel}}" style="width: 52px; height: 32px; border-radius: 16px; background: {{p.trackBg}}; position: relative; flex: none">
            <span style="position: absolute; top: 4px; left: {{p.knobX}}; width: 24px; height: 24px; border-radius: 12px; background: {{p.knobBg}}"></span>
          </span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid #22262E">
          <sc-for list="{{p.rules}}" as="r" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; gap: 12px">
              <span style="font-size: 22px; font-weight: 400; width: 66px">{{r.time}}</span>
              <span style="display: flex; gap: 3px">
                <sc-for list="{{r.days}}" as="d" hint-placeholder-count="7">
                  <span style="width: 20px; height: 22px; border-radius: 6px; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; background: {{d.bg}}; color: {{d.fg}}">{{d.l}}</span>
                </sc-for>
              </span>
              <span style="margin-left: auto; font-size: 12px; color: #A1A9B5; white-space: nowrap">{{r.note}}</span>
            </div>
          </sc-for>
        </div>
      </a>
    </sc-for>
  </div>

  <a href="PolicyEditor.dc.html" style="position: absolute; right: 16px; bottom: 100px; height: 56px; padding: 0 22px 0 18px; border-radius: 18px; background: {{accent}}; color: #1A1205; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; text-decoration: none; box-shadow: 0 8px 24px rgba(0,0,0,0.45)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    New policy
  </a>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding: 8px 12px 20px; box-sizing: border-box; background: #101318; border-top: 1px solid #1D2129; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #A1A9B5; font-size: 12px; font-weight: 500">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2"></path><path d="M5 3L2 6M19 3l3 3"></path></svg></span>Today
    </a>
    <a href="Policies.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #F3F4F6; font-size: 12px; font-weight: 500">
      <span style="width: 56px; height: 30px; border-radius: 15px; background: #2A2418; color: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>Policies
    </a>
    <a href="Health.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #A1A9B5; font-size: 12px; font-weight: 500">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center; position: relative"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"></path></svg><span style="position: absolute; top: 3px; right: 14px; width: 8px; height: 8px; border-radius: 4px; background: #FF7A66"></span></span>Health
    </a>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #A1A9B5; font-size: 12px; font-weight: 500">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></span>Settings
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#8AB4FF","#7EE0C3","#F2A0C8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FFB547';
    const L = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    const days = (on, color) => L.map((l, i) => ({
      l, bg: on.includes(i) ? color : '#1D2129', fg: on.includes(i) ? '#0B0D11' : '#7D8693'
    }));
    const policy = (name, color, tint, status, statusColor, enabled, rules) => ({
      name, color, tint, status, statusColor, rules,
      opacity: enabled ? 1 : 0.6,
      switchLabel: enabled ? 'On' : 'Off',
      trackBg: enabled ? accent : '#2A2F38',
      knobBg: enabled ? '#1A1205' : '#7D8693',
      knobX: enabled ? '24px' : '4px'
    });
    return {
      accent,
      policies: [
        policy('Work', '#8AB4FF', '#1A2233', 'Active · next Tue 07:55', '#A1A9B5', true, [
          { time: '07:55', days: days([0, 1, 2], '#8AB4FF'), note: '' },
          { time: '08:55', days: days([3, 4], '#8AB4FF'), note: '' }
        ]),
        policy('Gym', '#7EE0C3', '#15282A', 'Active · next Thu 06:30', '#A1A9B5', true, [
          { time: '06:30', days: days([1, 3], '#7EE0C3'), note: 'every 2 wk' }
        ]),
        policy('Weekend', '#F2A0C8', '#2A1823', 'Paused, resumes 14 Nov', '#FFB547', true, [
          { time: '09:30', days: days([5, 6], '#F2A0C8'), note: '' }
        ]),
        policy('Night shifts', '#C9B6FF', '#211C33', 'Off', '#A1A9B5', false, [
          { time: '14:00', days: days([0, 1, 2, 3], '#C9B6FF'), note: '' }
        ])
      ]
    };
  }
}
</script>
</body>
</html>
