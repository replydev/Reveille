<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ringing — Midnight</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200..700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: {{accent}}; font-family: 'Geist', system-ui, sans-serif; font-variant-numeric: tabular-nums; box-sizing: border-box; display: flex; flex-direction: column; padding: 112px 28px 40px">

  <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #8A7550">Tuesday, 3 November</span>
  <span style="font-size: 132px; font-weight: 200; letter-spacing: -0.05em; line-height: 1; margin-top: 16px">05:40</span>
  <span style="display: flex; align-items: center; gap: 10px; margin-top: 18px; font-size: 18px; font-weight: 500; color: #E8D3AE">
    <span style="width: 10px; height: 10px; border-radius: 3px; background: #C9B6FF"></span>
    Night shifts
  </span>
  <span style="margin-top: 6px; font-size: 14px; color: #8A7550">Backup rings at 05:42</span>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <button style="height: 80px; border-radius: 40px; border: none; background: #2A2418; color: {{accent}}; font-size: 20px; font-weight: 600">Dismiss</button>
    <button style="height: 80px; border-radius: 40px; border: 1.5px solid #3A3020; background: transparent; color: #E8D3AE; font-size: 20px; font-weight: 500">Snooze 9 min</button>
    <span style="text-align: center; font-size: 13px; color: #8A7550; margin-top: 4px">Screen stays dim · auto-snoozes after 5 min</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#8AB4FF","#7EE0C3","#F2A0C8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FFB547' };
  }
}
</script>
</body>
</html>
