# Create a weekday policy, see it on Today, open it from the hero card, then delete it from Policies.
appId: com.replydev.reveille
name: Policy
---
- runFlow: subflows/launch_clean.yaml
- tapOn: "Policies"
- tapOn: "New policy"
- tapOn: "Name"
- inputText: "Work"
- hideKeyboard
- runFlow:
    when:
      notVisible: "Remove alarm time"
    commands:
      - tapOn: "\\+ Alarm time"
- assertVisible: "Next: .*"
- tapOn: "Save"
- assertVisible: "Work"
- tapOn: "Today"
- assertVisible: "Next wake-up"
- assertNotVisible: "None scheduled"
- assertVisible: "Armed with system"
- assertVisible: "Work"
- tapOn: "Open policy"
- assertVisible: "Edit policy"
- back
- tapOn: "Policies"
- assertVisible: "Active · next .*"
- tapOn: "Work"
- assertVisible: "Edit policy"
- tapOn: "Delete policy"
- assertVisible: "Delete policy?"
- tapOn:
    text: "Delete"
    below: "Delete policy?"
- assertVisible: "No policies yet.*"
- tapOn: "Today"
- assertVisible: "None scheduled"
