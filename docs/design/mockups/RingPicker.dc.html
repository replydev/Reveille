<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reveille — Ringing theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200..800&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFB547}a:hover{color:#FFD08A}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0D11; color: #F3F4F6; font-family: 'Geist', system-ui, sans-serif; font-variant-numeric: tabular-nums; box-sizing: border-box">

  <header style="display: flex; align-items: center; gap: 4px; padding: 44px 8px 4px">
    <a href="Settings.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #F3F4F6"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="flex: 1; margin: 0; font-size: 18px; font-weight: 600">Ringing theme</h1>
  </header>

  <div role="radiogroup" aria-label="Theme" style="display: flex; gap: 12px; padding: 12px 16px 0; overflow: hidden">
    <sc-for list="{{themes}}" as="t" hint-placeholder-count="5">
      <button role="radio" aria-checked="{{t.checked}}" aria-label="{{t.name}}" style="flex: none; width: 150px; padding: 0; border: none; background: transparent; color: #F3F4F6; display: flex; flex-direction: column; align-items: stretch; gap: 10px; text-align: left">
        <span style="position: relative; display: block; width: 150px; height: 325px; border-radius: 22px; overflow: hidden; box-shadow: {{t.ring}}">
          <span style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform: scale(0.3846); transform-origin: 0 0; pointer-events: none">
            <sc-if value="{{t.isDawn}}" hint-placeholder-val="{{ false }}"><dc-import name="Ringing" hint-size="390px,844px"></dc-import></sc-if>
            <sc-if value="{{t.isMidnight}}" hint-placeholder-val="{{ false }}"><dc-import name="RingMidnight" hint-size="390px,844px"></dc-import></sc-if>
            <sc-if value="{{t.isPolicy}}" hint-placeholder-val="{{ false }}"><dc-import name="RingPolicy" hint-size="390px,844px"></dc-import></sc-if>
            <sc-if value="{{t.isHorizon}}" hint-placeholder-val="{{ false }}"><dc-import name="RingHorizon" hint-size="390px,844px"></dc-import></sc-if>
            <sc-if value="{{t.isPaper}}" hint-placeholder-val="{{ false }}"><dc-import name="RingPaper" hint-size="390px,844px"></dc-import></sc-if>
          </span>
          <sc-if value="{{t.selected}}" hint-placeholder-val="{{ false }}">
            <span style="position: absolute; right: 10px; top: 10px; width: 28px; height: 28px; border-radius: 14px; background: {{accent}}; color: #1A1205; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
          </sc-if>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px; padding: 0 2px">
          <span style="font-size: 15px; font-weight: 600">{{t.name}}</span>
          <span style="font-size: 12px; color: #A1A9B5">{{t.hint}}</span>
        </span>
      </button>
    </sc-for>
  </div>

  <div style="display: flex; gap: 10px; padding: 18px 16px 0">
    <button style="flex: 1; height: 48px; border-radius: 24px; border: 1px solid #2A2F38; background: transparent; color: #F3F4F6; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="3"></rect><path d="M11 18h2"></path></svg>
      Preview
    </button>
    <button style="flex: 1; height: 48px; border-radius: 24px; border: none; background: #1D2129; color: #F3F4F6; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      Test with sound
    </button>
  </div>

  <section aria-labelledby="per-policy" style="display: flex; flex-direction: column; gap: 8px; padding: 26px 16px 0">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin: 0 4px">
      <h2 id="per-policy" style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #A1A9B5">Per policy</h2>
      <span style="font-size: 12px; color: #A1A9B5">One-offs use the default</span>
    </div>
    <div style="border-radius: 20px; background: #15181E; border: 1px solid #22262E; overflow: hidden">
      <sc-for list="{{overrides}}" as="o" hint-placeholder-count="3">
        <button style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px 0 16px; border: none; border-bottom: 1px solid {{o.line}}; background: transparent; color: #F3F4F6; text-align: left">
          <span style="width: 10px; height: 10px; border-radius: 3px; background: {{o.color}}; flex: none"></span>
          <span style="flex: 1; font-size: 15px">{{o.name}}</span>
          <span style="font-size: 14px; color: {{o.valueColor}}">{{o.value}}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A9B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#8AB4FF","#7EE0C3","#F2A0C8"]},"selected":{"editor":"enum","options":["Dawn","Midnight","Policy colour","Horizon","Paper"],"default":"Dawn"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FFB547';
    const sel = this.props.selected ?? 'Dawn';
    const list = [
      ['Dawn', 'Default · amber', 'isDawn'],
      ['Midnight', 'Dim, for dark rooms', 'isMidnight'],
      ['Policy colour', 'Tells routines apart', 'isPolicy'],
      ['Horizon', 'Sunrise in bands', 'isHorizon'],
      ['Paper', 'Light and bold', 'isPaper']
    ];
    const themes = list.map(([name, hint, key]) => {
      const t = {
        name, hint, selected: name === sel, checked: name === sel ? 'true' : 'false',
        ring: name === sel ? '0 0 0 3px #0B0D11, 0 0 0 5px ' + accent : '0 0 0 1px #22262E',
        isDawn: false, isMidnight: false, isPolicy: false, isHorizon: false, isPaper: false
      };
      t[key] = true;
      return t;
    });
    return {
      accent, themes,
      overrides: [
        { name: 'Work', color: '#8AB4FF', value: 'Policy colour', valueColor: '#F3F4F6', line: '#22262E' },
        { name: 'Gym', color: '#7EE0C3', value: 'Default', valueColor: '#A1A9B5', line: '#22262E' },
        { name: 'Night shifts', color: '#C9B6FF', value: 'Midnight', valueColor: '#F3F4F6', line: 'transparent' }
      ]
    };
  }
}
</script>
</body>
</html>
