<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reveille — Widgets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFB547}a:hover{color:#FFD08A}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #2B3242; color: #F3F4F6; font-family: 'Geist', system-ui, sans-serif; font-variant-numeric: tabular-nums; box-sizing: border-box; padding: 64px 20px 32px; display: flex; flex-direction: column; gap: 14px">

  <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #D5DAE3">4 × 2</span>
  <div style="display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 28px; background: #0F1216">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #A1A9B5">
        <span style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}"></span>Next wake-up
      </span>
      <span style="font-size: 13px; color: #A1A9B5">in 9 h</span>
    </div>
    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 56px; font-weight: 300; letter-spacing: -0.04em; line-height: 0.95">07:55</span>
        <span style="font-size: 15px">Tomorrow · Work</span>
      </div>
      <button style="height: 44px; padding: 0 18px; border-radius: 22px; border: none; background: #1D2129; color: #F3F4F6; font-size: 14px; font-weight: 500">Skip</button>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 10px">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #D5DAE3">2 × 2</span>
      <div style="aspect-ratio: 1; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; padding: 18px; border-radius: 28px; background: {{accent}}; color: #1A1205">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18h16"></path><path d="M7 18a5 5 0 0 1 10 0"></path><path d="M12 6v3M5 10l2 1.5M19 10l-2 1.5"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 44px; font-weight: 300; letter-spacing: -0.04em; line-height: 1">07:55</span>
          <span style="font-size: 14px; font-weight: 500">Tue · Work</span>
        </div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #D5DAE3">Needs attention</span>
      <div style="aspect-ratio: 1; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; padding: 18px; border-radius: 28px; background: #0F1216; border: 1px solid #3A2A25">
        <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: #FF8A75">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 16H3z"></path><path d="M12 10v4"></path><path d="M12 17.5v.01"></path></svg>
          1 issue
        </span>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 44px; font-weight: 300; letter-spacing: -0.04em; line-height: 1">07:55</span>
          <span style="font-size: 14px; color: #A1A9B5">Tap to fix</span>
        </div>
      </div>
    </div>
  </div>

  <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #D5DAE3; margin-top: 10px">4 × 1 · empty</span>
  <div style="display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-radius: 24px; background: #0F1216">
    <span style="flex: 1; font-size: 16px; color: #A1A9B5">No alarms in the next 14 days</span>
    <span style="width: 40px; height: 40px; border-radius: 20px; background: #1D2129; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F3F4F6" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#8AB4FF","#7EE0C3","#F2A0C8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FFB547' };
  }
}
</script>
</body>
</html>
