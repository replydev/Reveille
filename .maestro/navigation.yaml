# Every tab opens from the bottom bar, Back from a tab returns to Today, and the one-off sheet closes.
appId: com.replydev.reveille
name: Navigation
---
- runFlow: subflows/launch_clean.yaml
- tapOn: "Policies"
- assertVisible: "No policies yet.*"
- tapOn: "Health"
- assertVisible: ".* of .* checks pass"
- assertVisible: "Ring a test alarm"
- scrollUntilVisible:
    element: "RECENT ALARMS"
- tapOn: "Settings"
- assertVisible: "Alarm sound"
- assertVisible: "Snooze length"
- tapOn: "Increase snooze length"
- assertVisible: "10 min"
- tapOn: "Decrease snooze length"
- assertVisible: "9 min"
- tapOn: "Today"
- assertVisible: "Next wake-up"
- tapOn: "Settings"
- back
- assertVisible: "Next wake-up"
- tapOn: "One-off alarm"
- assertVisible: "Close"
- tapOn: "Close"
- assertNotVisible: "Close"
- tapOn: "One-off alarm"
- assertVisible: "Close"
- back
- assertVisible: "Next wake-up"
- assertNotVisible: "Close"
