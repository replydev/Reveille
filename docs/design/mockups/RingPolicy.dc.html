<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ringing — Policy colour</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{policy}}; color: #0B1A33; font-family: 'Geist', system-ui, sans-serif; font-variant-numeric: tabular-nums; box-sizing: border-box; display: flex; flex-direction: column; padding: 96px 28px 36px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 44px; font-weight: 600; letter-spacing: -0.03em">Work</span>
    <span style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1.5px solid rgba(11,26,51,0.35); display: flex; align-items: center; font-size: 13px; font-weight: 600">Mon–Wed</span>
  </div>
  <span style="font-size: 15px; margin-top: 6px; opacity: 0.8">Tuesday, 3 November</span>

  <div aria-hidden="true" style="margin-top: 40px; height: 1.5px; background: rgba(11,26,51,0.25)"></div>

  <span style="font-size: 148px; font-weight: 200; letter-spacing: -0.06em; line-height: 1; margin-top: 28px; margin-left: -6px">07:55</span>
  <span style="font-size: 15px; margin-top: 10px; opacity: 0.8">Next: Wed 07:55</span>

  <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <button style="height: 112px; border-radius: 28px; border: 2px solid #0B1A33; background: transparent; color: #0B1A33; font-size: 19px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">Snooze<span style="font-size: 14px; font-weight: 500; opacity: 0.8">9 min</span></button>
    <button style="height: 112px; border-radius: 28px; border: none; background: #0B1A33; color: {{policy}}; font-size: 19px; font-weight: 600">Dismiss</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"policy":{"editor":"color","default":"#8AB4FF","options":["#8AB4FF","#7EE0C3","#F2A0C8","#C9B6FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { policy: this.props.policy ?? '#8AB4FF' };
  }
}
</script>
</body>
</html>
