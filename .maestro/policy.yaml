# Create a weekday policy, see it on Today, then delete it from Policies.
appId: com.replydev.reveille
name: Policy
---
- runFlow: subflows/launch_clean.yaml
- tapOn: "New policy"
- tapOn: "Name"
- inputText: "Work"
- hideKeyboard
- runFlow:
    when:
      notVisible: "Remove"
    commands:
      - tapOn: "Add alarm time"
- tapOn: "Save"
- assertVisible: "Next alarm"
- assertNotVisible: "None scheduled"
- assertVisible: "Work"
- tapOn: "Policies"
- tapOn: "Work"
- assertVisible: "Edit policy"
- tapOn: "Delete"
- assertVisible: "Delete policy?"
- tapOn:
    text: "Delete"
    below: "Delete policy?"
- assertVisible: "No policies yet.*"
- tapOn: "Today"
- assertVisible: "None scheduled"
