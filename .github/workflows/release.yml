name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Releases must never run concurrently: two runs could compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  ANDROID_PACKAGES: "platform-tools platforms;android-37.0 build-tools;37.0.0"
  BUILD_TOOLS: "37.0.0"

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  version:
    name: Compute version
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        name: Next semantic version
        run: |
          version="$(scripts/semver.sh next)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "Next release: **v$version**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release: no feat, fix, perf or breaking commits since the last tag." >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Build and publish v${{ needs.version.outputs.version }}
    needs: version
    if: ${{ needs.version.outputs.version != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v4
        with:
          packages: ${{ env.ANDROID_PACKAGES }}
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.REVEILLE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.REVEILLE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REVEILLE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.REVEILLE_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret REVEILLE_$name is not set. Run scripts/create-release-keystore.sh (see README)."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "REVEILLE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          REVEILLE_KEYSTORE_PASSWORD: ${{ secrets.REVEILLE_KEYSTORE_PASSWORD }}
          REVEILLE_KEY_ALIAS: ${{ secrets.REVEILLE_KEY_ALIAS }}
          REVEILLE_KEY_PASSWORD: ${{ secrets.REVEILLE_KEY_PASSWORD }}
        run: |
          IFS=. read -r major minor patch <<< "$VERSION"
          version_code=$(( major * 1000000 + minor * 1000 + patch ))
          ./gradlew :app:assembleRelease \
            -Preveille.versionName="$VERSION" \
            -Preveille.versionCode="$version_code"

      - name: Verify signature and package
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::Signed APK not found (was the build unsigned?)"; ls -R app/build/outputs/apk; exit 1; }
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2" dump badging "$apk" | grep -E "^package:" | tee badging.txt
          grep -q "versionName='$VERSION'" badging.txt || { echo "::error::versionName mismatch"; exit 1; }
          mkdir -p dist
          cp "$apk" "dist/reveille-v$VERSION.apk"
          (cd dist && sha256sum "reveille-v$VERSION.apk" > "reveille-v$VERSION.apk.sha256")

      - name: Release notes
        run: |
          {
            scripts/semver.sh notes
            echo "## Install"
            echo
            echo "Download \`reveille-v$VERSION.apk\` and open it on an Android 12+ phone (allow installs from this source)."
            echo "Verify it with \`sha256sum -c reveille-v$VERSION.apk.sha256\`."
          } > dist/notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            "dist/reveille-v$VERSION.apk" \
            "dist/reveille-v$VERSION.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "Reveille v$VERSION" \
            --notes-file dist/notes.md

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: reveille-v${{ env.VERSION }}
          path: dist/reveille-v*
          retention-days: 90

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
