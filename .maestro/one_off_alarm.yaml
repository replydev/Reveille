# Create a one-off alarm, skip it, undo the skip, then delete it.
appId: com.replydev.reveille
name: One-off alarm
---
- runFlow: subflows/launch_clean.yaml
- tapOn: "One-off alarm"
- tapOn: "Label (optional)"
- inputText: "Maestro one-off"
- hideKeyboard
- assertVisible: "Set for .*"
- tapOn: "Set for .*"
- assertVisible: "Tomorrow"
- assertVisible: "Maestro one-off"
- assertNotVisible: "None scheduled"
- tapOn: "Skip"
- assertNotVisible: "Maestro one-off"
- tapOn: "Undo"
- assertVisible: "Maestro one-off"
- assertVisible: "backup .*"
- tapOn: "Edit"
- assertVisible: "Edit alarm"
- tapOn: "Delete alarm"
- assertVisible: "Delete alarm?"
- tapOn:
    text: "Delete"
    below: "Delete alarm?"
- assertVisible: "None scheduled"
