<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ringing — Paper</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F1EA; color: #14130F; font-family: 'Geist', system-ui, sans-serif; font-variant-numeric: tabular-nums; box-sizing: border-box; display: flex; flex-direction: column; padding: 88px 24px 32px">

  <div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 12px; border-bottom: 2px solid #14130F">
    <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase">Reveille</span>
    <span style="font-size: 14px; font-weight: 500">Tue 3 Nov</span>
  </div>

  <span style="font-size: 156px; font-weight: 700; letter-spacing: -0.07em; line-height: 0.95; margin-top: 36px; margin-left: -8px">07:55</span>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 28px; border-top: 1px solid #C9C3B5">
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-right: 1px solid #C9C3B5">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5E594E">Alarm</span>
      <span style="font-size: 18px; font-weight: 600">Work</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0 14px 16px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5E594E">Ringing for</span>
      <span style="font-size: 18px; font-weight: 600; font-family: 'Geist Mono', monospace">0:42</span>
    </div>
  </div>
  <div aria-hidden="true" style="height: 4px; background: #E2DDD1"><div style="width: 14%; height: 4px; background: {{accent}}"></div></div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button style="height: 76px; border-radius: 4px; border: none; background: #14130F; color: #F4F1EA; font-size: 20px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; padding: 0 24px">Dismiss<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button>
    <button style="height: 76px; border-radius: 4px; border: 2px solid #14130F; background: transparent; color: #14130F; font-size: 20px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; padding: 0 24px">Snooze<span style="font-size: 16px; font-weight: 500; font-family: 'Geist Mono', monospace">+9 min</span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E8862A","options":["#E8862A","#3E6FD8","#14130F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#E8862A' };
  }
}
</script>
</body>
</html>
