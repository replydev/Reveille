<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reveille — Ringing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A1205}a:hover{color:#000}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{accent}}; color: #1A1205; font-family: 'Geist', system-ui, sans-serif; font-variant-numeric: tabular-nums; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; padding: 96px 24px 40px">

  <div aria-hidden="true" style="position: absolute; left: 50%; top: 300px; width: 520px; height: 520px; margin-left: -260px; border-radius: 50%; border: 1px solid rgba(26,18,5,0.10)"></div>
  <div aria-hidden="true" style="position: absolute; left: 50%; top: 380px; width: 360px; height: 360px; margin-left: -180px; border-radius: 50%; border: 1px solid rgba(26,18,5,0.14)"></div>
  <div aria-hidden="true" style="position: absolute; left: 50%; top: 460px; width: 200px; height: 200px; margin-left: -100px; border-radius: 50%; background: rgba(26,18,5,0.06)"></div>

  <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; position: relative">Tuesday, 3 November</span>
  <span style="font-size: 124px; font-weight: 300; letter-spacing: -0.05em; line-height: 1; margin-top: 18px; position: relative">07:55</span>
  <span style="display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; height: 36px; padding: 0 16px; border-radius: 18px; background: rgba(26,18,5,0.10); font-size: 16px; font-weight: 500; position: relative">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
    Work
  </span>

  <div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 14px; position: relative">
    <button style="width: 100%; height: 76px; border-radius: 38px; border: none; background: #1A1205; color: {{accent}}; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">Dismiss</button>
    <button style="width: 100%; height: 76px; border-radius: 38px; border: 2px solid #1A1205; background: transparent; color: #1A1205; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">Snooze 9 min</button>
    <span style="text-align: center; font-size: 13px; opacity: 0.8; margin-top: 6px">Auto-snoozes after 5 min of ringing</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#8AB4FF","#7EE0C3","#F2A0C8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FFB547' };
  }
}
</script>
</body>
</html>
