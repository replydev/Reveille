<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reveille — Today with update notice</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFB547}a:hover{color:#FFD08A}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0D11; color: #F3F4F6; font-family: 'Geist', system-ui, sans-serif; font-variant-numeric: tabular-nums; box-sizing: border-box">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 52px 20px 12px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; color: #A1A9B5">Tuesday, 3 November</span>
      <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">Today</h1>
    </div>
  </header>

  <section aria-label="Next wake-up" style="margin: 8px 16px 0; padding: 22px 22px 18px; border-radius: 28px; background: #15181E; border: 1px solid #22262E; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: {{accent}}">Next wake-up</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #A1A9B5"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}"></span>Armed with system</span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 12px">
      <span style="font-size: 84px; font-weight: 300; line-height: 0.9; letter-spacing: -0.04em">07:55</span>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 17px; font-weight: 500">Tomorrow</span>
        <span style="font-size: 14px; color: #A1A9B5">in 21 h</span>
      </span>
    </div>
    <div style="display: flex; gap: 8px">
      <span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; background: #1D2129; font-size: 13px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #8AB4FF"></span>Work</span>
      <span style="display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 8px; background: #1D2129; font-size: 13px; color: #A1A9B5; font-family: 'Geist Mono', monospace">backup 07:57</span>
    </div>
  </section>

  <a href="UpdateSheet.dc.html" style="margin: 12px 16px 0; display: flex; align-items: center; gap: 12px; padding: 12px 8px 12px 14px; border-radius: 20px; background: #1A1810; border: 1px solid #3A3020; text-decoration: none; color: inherit">
    <span style="width: 36px; height: 36px; border-radius: 12px; background: #2A2418; color: {{accent}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg></span>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
      <span style="font-size: 14px; font-weight: 600">Update ready: v0.3.0</span>
      <span style="font-size: 13px; color: #A1A9B5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">New launcher icon, smoother Back</span>
    </span>
    <span style="font-size: 14px; font-weight: 600; color: {{accent}}; padding: 0 6px">View</span>
    <button aria-label="Dismiss until next release" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: transparent; color: #A1A9B5; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </a>

  <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 24px 20px 6px">
    <h2 style="margin: 0; font-size: 15px; font-weight: 600">Next 14 days</h2>
    <span style="font-size: 13px; color: #A1A9B5">8 alarms</span>
  </div>
  <div style="display: flex; flex-direction: column; padding: 0 16px">
    <sc-for list="{{days}}" as="day" hint-placeholder-count="3">
      <div style="display: flex; gap: 14px; padding: 12px 4px; border-top: 1px solid #1D2129">
        <div style="width: 44px; flex: none; display: flex; flex-direction: column; align-items: center">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #A1A9B5">{{day.dow}}</span>
          <span style="font-size: 20px; font-weight: 500">{{day.num}}</span>
        </div>
        <div style="flex: 1; display: flex; align-items: center; gap: 12px; min-height: 40px">
          <span style="font-size: 20px; width: 62px">{{day.time}}</span>
          <span style="flex: 1; display: flex; align-items: center; gap: 8px; font-size: 14px"><span style="width: 8px; height: 8px; border-radius: 2px; background: {{day.color}}"></span>{{day.label}}</span>
          <span style="font-size: 13px; color: #A1A9B5; padding: 0 12px">Skip</span>
        </div>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding: 8px 12px 20px; box-sizing: border-box; background: #101318; border-top: 1px solid #1D2129; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="UpdateToday.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #F3F4F6; font-size: 12px; font-weight: 500">
      <span style="width: 56px; height: 30px; border-radius: 15px; background: #2A2418; color: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2"></path><path d="M5 3L2 6M19 3l3 3"></path></svg></span>Today
    </a>
    <a href="Policies.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #A1A9B5; font-size: 12px; font-weight: 500">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>Policies
    </a>
    <a href="Health.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #A1A9B5; font-size: 12px; font-weight: 500">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"></path></svg></span>Health
    </a>
    <a href="UpdateSettings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #A1A9B5; font-size: 12px; font-weight: 500">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center; position: relative"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg><span style="position: absolute; top: 3px; right: 14px; width: 8px; height: 8px; border-radius: 4px; background: {{accent}}"></span></span>Settings
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#8AB4FF","#7EE0C3","#F2A0C8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#FFB547',
      days: [
        { dow: 'Wed', num: '4', time: '07:55', label: 'Work', color: '#8AB4FF' },
        { dow: 'Thu', num: '5', time: '06:30', label: 'Gym', color: '#7EE0C3' },
        { dow: 'Fri', num: '6', time: '08:55', label: 'Work', color: '#8AB4FF' }
      ]
    };
  }
}
</script>
</body>
</html>
